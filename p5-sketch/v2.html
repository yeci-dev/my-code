<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>p5 · v2 速度</title>
<style>
  html, body { margin: 0; height: 100%; background: #08080c; overflow: hidden; }
  canvas { display: block; }
</style>
<script src="./p5.min.js"></script>
</head>
<body>
<script>
// ── 变化只有三个地方，都标了「←」
// 1. 颜色改成了 HSB 模式（色相 / 饱和度 / 亮度），比 RGB 好调
// 2. 用鼠标移动的速度决定圆的大小和亮度
// 3. 加了按键：R 清屏，S 存图

function setup() {
  createCanvas(windowWidth, windowHeight);
  background(8, 8, 12);
  noStroke();
  colorMode(HSB, 360, 100, 100, 100);   // ← HSB 色彩模式
}

function draw() {
  // 鼠标这一帧移动了多远 = 手的快慢
  let speed = dist(mouseX, mouseY, pmouseX, pmouseY);

  // 越快 → 圆越大、越亮；慢下来 → 变细变暗
  let size  = constrain(6 + speed * 1.4, 6, 80);    // ← 1.4 控制放大倍数
  let alpha = constrain(8 + speed * 2.2, 8, 95);    // ← 2.2 控制亮度
  let hue   = map(sin(frameCount * 0.01), -1, 1, 250, 355);  // ← 蓝 → 紫 → 红

  fill(hue, 75, 95, alpha);
  circle(mouseX, mouseY, size);
}

function keyPressed() {
  if (key === 'r' || key === 'R') background(8, 8, 12);   // 清屏
  if (key === 's' || key === 'S') saveCanvas('my-draw', 'png');  // 存成图片
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
</body>
</html>

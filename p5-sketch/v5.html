<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>p5 · v5 风雨</title>
<style>
  html, body { margin: 0; height: 100%; background: #06080c; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
<script src="./p5.min.js"></script>
</head>
<body>
<script>
// 在 v4 的基础上加了两样：
// ① 风：wind 缓慢左右摆动，雨丝和水花都跟着偏
// ② 闪电：每隔 7~15 秒，整个画面白一下，然后衰减

let drops = [];
let splashes = [];

let wind = 0;          // 风：-1（向左）~ 1（向右）
let flash = 0;         // 闪电亮度：1 → 0
let nextFlash = 120;   // 下一次闪电在第几帧（第一次很快）

function newDrop() {
  const land = random(height * 0.10, height * 0.78);
  const near = map(land, height * 0.10, height * 0.78, 0, 1);
  return {
    x: random(width),
    y: random(-height, land),
    land: land,
    near: near,
    len: lerp(10, 46, near) + random(-4, 6),
    speed: lerp(3, 14, near) + random(-1, 1),
    w: lerp(0.7, 2.3, near),
    alpha: lerp(10, 60, near)
  };
}

function newSplash(x, y, near) {
  const parts = [];
  const scale = 0.6 + near * 0.9;
  for (let i = 0; i < 5; i++) {
    parts.push({
      x: x + random(-5, 5),
      y: y,
      vx: (random(-2.4, 2.4) + wind * 2.2) * scale,   // ← 风把水花也吹偏
      vy: random(-5, -1.4) * scale,
      r: random(1.2, 2.6) * scale
    });
  }
  return { x: x, y: y, ring: 0, scale: scale, parts: parts, life: 1 };
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  for (let i = 0; i < 360; i++) drops.push(newDrop());
}

function draw() {
  // ── 风：慢慢左右摆，周期大约 10 秒
  wind = sin(frameCount * 0.012);
  const tilt = wind * 0.32;      // 雨丝倾斜程度

  background(230, 30, 5, 18);

  // 鼠标那盏路灯
  const ctx = drawingContext;
  const g = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 240);
  g.addColorStop(0,    'rgba(255, 226, 170, 0.07)');
  g.addColorStop(0.45, 'rgba(255, 210, 150, 0.03)');
  g.addColorStop(1,    'rgba(255, 200, 130, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 240, 0, Math.PI * 2);
  ctx.fill();

  // 雨
  for (let d of drops) {
    stroke(205, 12, 95, d.alpha);
    strokeWeight(d.w);
    line(d.x, d.y, d.x + d.len * tilt, d.y + d.len);   // ← 雨丝按风向倾斜

    d.y += d.speed;
    d.x += d.speed * tilt;                             // ← 下落时也被吹着走

    // 被吹出屏幕就从另一边回来，不然雨会越来越稀
    if (d.x < -60)  d.x = width + 50;
    if (d.x > width + 60) d.x = -50;

    if (d.y > d.land) {
      // 近处几乎必溅，远处稀一点，不然整片糊住
      if (random() < 0.2 + d.near * 0.8) splashes.push(newSplash(d.x, d.land, d.near));
      d.y = random(-200, -10);
      d.x = random(width);
    }
  }

  // 水花
  for (let s of splashes) {
    s.life -= 0.05;
    s.ring += 4 * s.scale;

    stroke(210, 8, 100, 26 * s.life);
    strokeWeight(0.7);
    noFill();
    ellipse(s.x, s.y, s.ring, s.ring * 0.3);

    for (let p of s.parts) {
      p.vy += 0.22;
      p.x += p.vx;
      p.y += p.vy;

      if (p.y > s.y) {
        p.y = s.y;
        p.vy *= -0.35;
        p.vx *= 0.7;
      }

      stroke(210, 8, 100, 130 * s.life);
      strokeWeight(p.r);
      point(p.x, p.y);
    }
  }
  splashes = splashes.filter(s => s.life > 0);

  // ── 闪电
  if (frameCount > nextFlash) {
    flash = 1;
    nextFlash = frameCount + int(random(420, 900));   // 7~15 秒后下一次
  }
  if (flash > 0.01) {
    noStroke();
    fill(210, 12, 100, flash * 35);    // ← 35 控制闪多亮，改大更猛
    rect(0, 0, width, height);
    flash *= 0.80;                     // ← 0.80 控制衰减快慢（越小越快）
  }
}

function keyPressed() {
  if (key === 'r' || key === 'R') background(6, 6, 10);
  if (key === 's' || key === 'S') saveCanvas('rain-splash', 'png');
  if (key === 'f' || key === 'F') flash = 1;      // 手动打闪，不用等
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  drops = [];
  for (let i = 0; i < 360; i++) drops.push(newDrop());
}
</script>
</body>
</html>

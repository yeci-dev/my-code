<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>p5 · v7 雷·风·灯光</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060a; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
<script src="./p5.min.js"></script>
</head>
<body>
<script>
// 三样东西合在一起：
//   雷  —— 每隔 7~15 秒闪一下，按 F 可以手动打
//   风  —— 缓慢左右摆，雨丝和水花都跟着偏
//   灯光 —— 远处一排模糊的街灯

let drops = [];
let splashes = [];
let lights = [];
let showLights = false;   // 默认关灯，按 L 切换

let wind = 0;
let flash = 0;
let nextFlash = 120;
let flashX = 0, flashY = 0;   // 闪电从哪个点亮起

function newDrop() {
  const land = random(height * 0.10, height * 0.78);
  const near = map(land, height * 0.10, height * 0.78, 0, 1);
  return {
    x: random(width),
    y: random(-height, land),
    land: land,
    near: near,
    len: lerp(10, 46, near) + random(-4, 6),
    speed: lerp(3, 14, near) + random(-1, 1),
    w: lerp(0.7, 2.3, near),
    alpha: lerp(10, 60, near)
  };
}

function newSplash(x, y, near) {
  const parts = [];
  const scale = 0.6 + near * 0.9;
  for (let i = 0; i < 5; i++) {
    parts.push({
      x: x + random(-3, 3),
      y: y,
      vx: (random(-2.4, 2.4) + wind * 2.2) * scale,
      vy: random(-5, -1.4) * scale,
      r: random(1.2, 2.6) * scale
    });
  }
  return { x: x, y: y, ring: 0, scale: scale, parts: parts, life: 1 };
}

// 远处的街灯：一排模糊的光斑
function makeLights() {
  lights = [];
  for (let i = 0; i < 12; i++) {
    lights.push({
      x: random(width),
      y: height * 0.50 + random(-0.06, 0.06) * height,  // 一条街
      r: random(30, 80),
      warm: random() < 0.7,
      a: random(3, 6)                                   // 更暗
    });
  }
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  for (let i = 0; i < 360; i++) drops.push(newDrop());
  makeLights();
}

function draw() {
  // ── 风
  wind = sin(frameCount * 0.012);
  const tilt = wind * 0.32;

  background(230, 30, 5, 18);

  // ── 灯光（默认不显示）
  const ctx = drawingContext;
  if (showLights) for (let L of lights) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, L.r);
    const c = L.warm ? '255, 200, 120' : '150, 200, 255';
    g.addColorStop(0,    'rgba(' + c + ', ' + (L.a / 100) + ')');
    g.addColorStop(0.45, 'rgba(' + c + ', ' + (L.a / 380) + ')');
    g.addColorStop(1,    'rgba(' + c + ', 0)');

    // 拉成竖椭圆：像湿路面上的光，而不是一个圆片
    ctx.save();
    ctx.translate(L.x, L.y);
    ctx.scale(1, 1.7);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, L.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ── 鼠标那盏近处的路灯
  const g = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 240);
  g.addColorStop(0,    'rgba(255, 226, 170, 0.07)');
  g.addColorStop(0.45, 'rgba(255, 210, 150, 0.03)');
  g.addColorStop(1,    'rgba(255, 200, 130, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 240, 0, Math.PI * 2);
  ctx.fill();

  // ── 雨
  for (let d of drops) {
    stroke(205, 12, 95, d.alpha);
    strokeWeight(d.w);
    line(d.x, d.y, d.x + d.len * tilt, d.y + d.len);

    d.y += d.speed;
    d.x += d.speed * tilt;

    if (d.x < -60) d.x = width + 50;
    if (d.x > width + 60) d.x = -50;

    if (d.y > d.land) {
      if (random() < 0.2 + d.near * 0.8) splashes.push(newSplash(d.x, d.land, d.near));
      d.y = random(-200, -10);
      d.x = random(width);
    }
  }

  // ── 水花
  for (let s of splashes) {
    s.life -= 0.05;

    // 涟漪
    s.ring += 4 * s.scale;
    stroke(210, 8, 100, 26 * s.life);
    strokeWeight(0.7);
    noFill();
    ellipse(s.x, s.y, s.ring, s.ring * 0.3);

    for (let p of s.parts) {
      p.vy += 0.22;
      p.x += p.vx;
      p.y += p.vy;

      // 掉回它自己那一层就弹一下
      if (p.y > s.y) {
        p.y = s.y;
        p.vy *= -0.35;
        p.vx *= 0.7;
      }

      stroke(210, 8, 100, 130 * s.life);
      strokeWeight(p.r);
      point(p.x, p.y);
    }
  }
  splashes = splashes.filter(s => s.life > 0);

  // ── 雾：上方一层很淡的灰蓝
  const fog = ctx.createLinearGradient(0, 0, 0, height * 0.7);
  fog.addColorStop(0, 'rgba(170, 195, 220, 0.012)');
  fog.addColorStop(1, 'rgba(170, 195, 220, 0)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, 0, width, height * 0.7);

  // ── 暗角：四角压暗，把视线收拢到中间
  const vg = ctx.createRadialGradient(
    width / 2, height / 2, Math.min(width, height) * 0.22,
    width / 2, height / 2, Math.max(width, height) * 0.72
  );
  vg.addColorStop(0, 'rgba(0, 0, 0, 0)');
  vg.addColorStop(1, 'rgba(0, 0, 0, 0.075)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, width, height);

  // ── 雷
  if (frameCount > nextFlash) {
    flash = 1;
    flashX = random(width);
    flashY = random(height * 0.05, height * 0.45);
    nextFlash = frameCount + int(random(420, 900));
  }
  if (flash > 0.01) {
    const fg = ctx.createRadialGradient(flashX, flashY, 0, flashX, flashY, max(width, height) * 1.15);
    fg.addColorStop(0,    'rgba(225, 238, 255, ' + (flash * 0.55) + ')');
    fg.addColorStop(0.3,  'rgba(200, 222, 255, ' + (flash * 0.16) + ')');
    fg.addColorStop(1,    'rgba(200, 222, 255, 0)');
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, width, height);
    flash *= 0.80;
  }
}

function keyPressed() {
  if (key === 'r' || key === 'R') { background(6, 6, 10); makeLights(); }
  if (key === 's' || key === 'S') saveCanvas('thunder-wind-lights', 'png');
  if (key === 'f' || key === 'F') { flash = 1; flashX = random(width); flashY = random(height * 0.05, height * 0.45); }
  if (key === 'l' || key === 'L') showLights = !showLights;   // 开关灯光
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  makeLights();
  drops = [];
  for (let i = 0; i < 360; i++) drops.push(newDrop());
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>p5 · v4 水花</title>
<style>
  html, body { margin: 0; height: 100%; background: #06080c; overflow: hidden; cursor: crosshair; }
  canvas { display: block; }
</style>
<script src="./p5.min.js"></script>
</head>
<body>
<script>
// 关键改动：每滴雨自己决定"落在哪一层"
//   land 低 = 离你近 → 雨丝更长、更粗、更快、水花更大
//   land 高 = 离你远 → 雨丝短、细、慢、水花小
// 所以水花会散成一片，而不是排在一条线上

let drops = [];
let splashes = [];

function newDrop() {
  const land = random(height * 0.42, height * 0.92);
  const near = map(land, height * 0.42, height * 0.92, 0, 1);   // 0 远 / 1 近
  return {
    x: random(width),
    y: random(-height, land),
    land: land,                                                 // ← 这滴雨的落点
    near: near,
    len: lerp(10, 46, near) + random(-4, 6),                    // 雨丝长度
    speed: lerp(3, 14, near) + random(-1, 1),                   // 下落速度
    w: lerp(0.7, 2.3, near),                                    // 粗细
    alpha: lerp(10, 60, near)                                   // 明暗
  };
}

// 溅起的水花
function newSplash(x, y, near) {
  const parts = [];
  const scale = 0.6 + near * 0.9;                               // 近处的水花更大
  for (let i = 0; i < 6; i++) {
    parts.push({
      x: x + random(-5, 5),
      y: y,
      vx: random(-2.4, 2.4) * scale,                            // 散开宽度
      vy: random(-5, -1.4) * scale,                             // 弹起高度
      r: random(1.2, 2.6) * scale
    });
  }
  return { x: x, y: y, ring: 0, scale: scale, parts: parts, life: 1 };
}

function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  for (let i = 0; i < 420; i++) drops.push(newDrop());
}

function draw() {
  // 半透明黑 → 拖影
  background(230, 30, 5, 18);

  // 鼠标那盏路灯（径向渐变，边缘是软的）
  const ctx = drawingContext;
  const g = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 240);
  g.addColorStop(0,    'rgba(255, 226, 170, 0.07)');
  g.addColorStop(0.45, 'rgba(255, 210, 150, 0.03)');
  g.addColorStop(1,    'rgba(255, 200, 130, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(mouseX, mouseY, 240, 0, Math.PI * 2);
  ctx.fill();

  // 雨
  for (let d of drops) {
    stroke(205, 12, 95, d.alpha);
    strokeWeight(d.w);
    line(d.x, d.y, d.x + d.len * 0.18, d.y + d.len);

    d.y += d.speed;
    d.x += d.speed * 0.18;

    // 落到了「自己那一层」，就在原地溅开
    if (d.y > d.land) {
      if (random() < 0.35) splashes.push(newSplash(d.x, d.land, d.near));
      d.y = random(-200, -10);
      d.x = random(width);
    }
  }

  // 水花
  for (let s of splashes) {
    s.life -= 0.035;

    // 涟漪：落在哪就在哪扩散
    s.ring += 7 * s.scale;
    stroke(210, 8, 100, 55 * s.life);
    strokeWeight(0.8);
    noFill();
    ellipse(s.x, s.y, s.ring, s.ring * 0.3);

    for (let p of s.parts) {
      p.vy += 0.22;          // 重力
      p.x += p.vx;
      p.y += p.vy;

      // 掉回它自己那一层就弹一下
      if (p.y > s.y) {
        p.y = s.y;
        p.vy *= -0.35;
        p.vx *= 0.7;
      }

      stroke(210, 8, 100, 160 * s.life);
      strokeWeight(p.r);
      point(p.x, p.y);
    }
  }
  splashes = splashes.filter(s => s.life > 0);
}

function keyPressed() {
  if (key === 'r' || key === 'R') background(6, 6, 10);
  if (key === 's' || key === 'S') saveCanvas('rain-splash', 'png');
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  drops = [];
  for (let i = 0; i < 420; i++) drops.push(newDrop());
}
</script>
</body>
</html>
